<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laufzeiten Rechner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a0a0a;
    color: #f0d0d0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .container { max-width: 500px; width: 100%; }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 1.5rem;
    color: #f87171;
  }
  .mode-toggle {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    border: 2px solid #3d1c1c;
  }
  .mode-btn {
    flex: 1;
    padding: 0.75rem;
    text-align: center;
    background: #2a1010;
    color: #a08080;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #dc2626;
    color: #fff;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    align-items: center;
  }
  .input-row label {
    width: 80px;
    font-size: 0.9rem;
    color: #c09090;
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 2px solid #3d1c1c;
    background: #2a1010;
    color: #f0d0d0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: #f87171; }
  .input-row .unit { color: #a08080; font-size: 0.85rem; width: 55px; }
  .input-row label.clickable {
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .input-row label.clickable:hover { color: #f87171; }
  .separator { margin: 1rem 0; border-top: 1px solid #3d1c1c; }
  .or-divider {
    text-align: center;
    color: #6b4040;
    font-size: 0.8rem;
    margin: 0.5rem 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #3d1c1c;
  }
  th {
    background: #2a1010;
    padding: 0.75rem 1rem;
    text-align: left;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #a08080;
  }
  td {
    padding: 0.7rem 1rem;
    font-size: 1.05rem;
    border-top: 1px solid #2a1010;
    font-variant-numeric: tabular-nums;
  }
  tr:nth-child(even) td { background: rgba(42,16,16,0.5); }
  tr.highlight td {
    background: rgba(248,113,113,0.15);
    color: #f87171;
    font-weight: 700;
  }
  .arrow {
    font-size: 0.7rem;
    margin-left: 4px;
    display: inline-block;
    opacity: 0.7;
  }
  .arrow.up { color: #f87171; }
  .arrow.down { color: #4ade80; }
  .arrow.exact { visibility: hidden; }
  .info {
    text-align: center;
    margin-top: 1rem;
    color: #6b4040;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Laufzeiten</h1>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="15x1">15 × 1'</button>
    <button class="mode-btn" data-mode="4x4">4 × 4'</button>
  </div>

  <div class="input-row">
    <label>Distanz</label>
    <input type="number" id="distInput" step="any" placeholder="z.B. 275">
    <span class="unit">m</span>
  </div>
  <div class="input-row">
    <label>Zeit</label>
    <input type="number" id="timeInput" step="any" placeholder="z.B. 60">
    <span class="unit">s</span>
  </div>
  <div class="or-divider">– oder –</div>
  <div class="input-row">
    <label id="paceLabel" class="clickable">Pace</label>
    <input type="text" id="paceInput" placeholder="z.B. 3:38">
    <span class="unit" id="paceUnit">min/km</span>
  </div>

  <div class="separator"></div>

  <table>
    <thead><tr><th>Distanz</th><th>Zeit</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <div class="info" id="info"></div>
</div>

<script>
  let mode = '15x1';
  let lastInput = 'disttime'; // 'disttime' or 'pace'
  let paceMode = 'pace'; // 'pace' or 'kmh'

  const modeBtns = document.querySelectorAll('.mode-btn');
  const distInput = document.getElementById('distInput');
  const timeInput = document.getElementById('timeInput');
  const paceInput = document.getElementById('paceInput');
  const paceLabel = document.getElementById('paceLabel');
  const paceUnit = document.getElementById('paceUnit');
  const results = document.getElementById('results');
  const info = document.getElementById('info');

  distInput.value = '275';
  timeInput.value = '60';
  syncPaceFromDistTime();

  modeBtns.forEach(btn => btn.addEventListener('click', () => {
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    calculate();
  }));

  paceLabel.addEventListener('click', () => {
    // Convert current value before switching
    const oldVal = getSecPerMeterFromPaceField();
    paceMode = paceMode === 'pace' ? 'kmh' : 'pace';
    paceLabel.textContent = paceMode === 'pace' ? 'Pace' : 'Tempo';
    paceUnit.textContent = paceMode === 'pace' ? 'min/km' : 'km/h';
    paceInput.placeholder = paceMode === 'pace' ? 'z.B. 3:38' : 'z.B. 16.5';
    // Re-sync displayed value
    if (oldVal && oldVal > 0) {
      setPaceFieldFromSecPerMeter(oldVal);
    }
  });

  distInput.addEventListener('input', () => { lastInput = 'disttime'; syncPaceFromDistTime(); calculate(); });
  timeInput.addEventListener('input', () => { lastInput = 'disttime'; syncPaceFromDistTime(); calculate(); });
  paceInput.addEventListener('input', () => { lastInput = 'pace'; syncDistTimeFromPace(); calculate(); });

  function parsePace(val) {
    if (typeof val === 'string' && val.includes(':')) {
      const parts = val.split(':');
      return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
    }
    return parseFloat(val) * 60;
  }

  // Returns sec/m from paceInput regardless of paceMode
  function getSecPerMeterFromPaceField() {
    const raw = paceInput.value;
    if (paceMode === 'pace') {
      const paceSec = parsePace(raw);
      if (isNaN(paceSec) || paceSec <= 0) return null;
      return paceSec / 1000;
    } else {
      const kmh = parseFloat(raw);
      if (isNaN(kmh) || kmh <= 0) return null;
      return 3.6 / kmh; // 1 m/s = 3.6 km/h
    }
  }

  // Sets paceInput value from sec/m
  function setPaceFieldFromSecPerMeter(spm) {
    if (paceMode === 'pace') {
      const paceSeconds = spm * 1000;
      const pm = Math.floor(paceSeconds / 60);
      const ps = paceSeconds - pm * 60;
      paceInput.value = pm + ':' + ps.toFixed(0).padStart(2, '0');
    } else {
      const kmh = 3.6 / spm;
      paceInput.value = kmh.toFixed(1);
    }
  }

  function syncPaceFromDistTime() {
    const d = parseFloat(distInput.value);
    const t = parseFloat(timeInput.value);
    if (!isNaN(d) && !isNaN(t) && d > 0 && t > 0) {
      setPaceFieldFromSecPerMeter(t / d);
    }
  }

  function syncDistTimeFromPace() {
    const spm = getSecPerMeterFromPaceField();
    if (spm && spm > 0) {
      let d = parseFloat(distInput.value);
      if (isNaN(d) || d <= 0) {
        d = 10;
        distInput.value = '10';
      }
      const t = spm * d;
      timeInput.value = t.toFixed(1);
    }
  }

  function formatTime15(seconds) {
    const rounded = Math.round(seconds * 10) / 10;
    const diff = rounded - seconds;
    let arrow = '<span class="arrow exact">–</span>';
    if (Math.abs(diff) > 0.001) {
      arrow = diff > 0
        ? '<span class="arrow up">▲</span>'
        : '<span class="arrow down">▼</span>';
    }
    return rounded.toFixed(1) + 's' + arrow;
  }

  function formatTime4x4(seconds) {
    const rounded = Math.round(seconds * 10) / 10;
    const diff = rounded - seconds;
    let arrow = '<span class="arrow exact">–</span>';
    if (Math.abs(diff) > 0.001) {
      arrow = diff > 0
        ? '<span class="arrow up">▲</span>'
        : '<span class="arrow down">▼</span>';
    }
    const m = Math.floor(rounded / 60);
    const s = rounded - m * 60;
    const sStr = s < 10 ? '0' + s.toFixed(1) : s.toFixed(1);
    return m + ':' + sStr + arrow;
  }

  function calculate() {
    let secPerMeter;
    if (lastInput === 'pace') {
      secPerMeter = getSecPerMeterFromPaceField();
      if (!secPerMeter || secPerMeter <= 0) { results.innerHTML = ''; info.textContent = ''; return; }
    } else {
      const dist = parseFloat(distInput.value);
      const time = parseFloat(timeInput.value);
      if (isNaN(dist) || isNaN(time) || dist <= 0 || time <= 0) { results.innerHTML = ''; info.textContent = ''; return; }
      secPerMeter = time / dist;
    }
    results.innerHTML = '';
    info.textContent = '';

    if (mode === '15x1') {
      const maxTime = 60;
      const step = 50;
      const rows = [];

      for (let d = step; ; d += step) {
        const t = d * secPerMeter;
        if (t > maxTime) break;
        rows.push({ dist: d, time: t, highlight: false });
      }

      // Always show 60s endpoint
      const maxDist = maxTime / secPerMeter;
      const lastRow = rows.length > 0 ? rows[rows.length - 1] : null;
      if (!lastRow || Math.abs(lastRow.time - maxTime) > 0.05) {
        rows.push({ dist: Math.round(maxDist), time: maxTime, highlight: true });
      } else {
        rows[rows.length - 1].highlight = true;
      }

      rows.forEach(r => {
        const tr = document.createElement('tr');
        if (r.highlight) tr.classList.add('highlight');
        tr.innerHTML = `<td>${r.dist}m</td><td>${formatTime15(r.time)}</td>`;
        results.appendChild(tr);
      });

      info.textContent = `${maxDist.toFixed(1)}m in 60s`;

    } else {
      const maxTime = 240;
      const step = 100;
      const rows = [];

      for (let d = step; ; d += step) {
        const t = d * secPerMeter;
        if (t > maxTime) break;
        rows.push({ dist: d, time: t, highlight: false });
      }

      const maxDist = maxTime / secPerMeter;
      const lastRow = rows.length > 0 ? rows[rows.length - 1] : null;
      if (!lastRow || Math.abs(lastRow.time - maxTime) > 0.5) {
        rows.push({ dist: Math.round(maxDist), time: maxTime, highlight: true });
      } else {
        rows[rows.length - 1].highlight = true;
      }

      rows.forEach(r => {
        const tr = document.createElement('tr');
        if (r.highlight) tr.classList.add('highlight');
        tr.innerHTML = `<td>${r.dist}m</td><td>${formatTime4x4(r.time)}</td>`;
        results.appendChild(tr);
      });

      info.textContent = `${maxDist.toFixed(1)}m in 4:00`;
    }
  }

  calculate();
</script>
</body>
</html>
